name: music_apl
description: "A modern cross-platform music streaming and offline player app built with Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Audio & Background Playback
  just_audio: ^0.9.39
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # Music Source (YouTube extractor)
  youtube_explode_dart: ^2.3.0

  # Local Database
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Networking & Downloads
  dio: ^5.5.0
  http: ^1.2.1

  # UI & Utilities
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
